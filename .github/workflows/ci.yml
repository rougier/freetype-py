# based on https://github.com/joerick/cibuildwheel/blob/master/examples/github-minimal.yml

name: Build

on:
  push:
    branches: [master]
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*'  # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build wheels on ${{ matrix.os }} ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          cibw_build: "cp37-*"
          cibw_archs_linux: "auto64"
        - os: windows-latest
          cibw_build: "cp37-*"
        - os: macos-latest
          cibw_build: "cp38-macosx_universal2"
          cibw_archs_macos: "universal2"
          name: '(universal2)'
        - os: 'ubuntu-latest'
          cibw_build: "cp37-manylinux*"
          cibw_archs_linux: 'aarch64'
          name: '(manylinux aarch64)'
          qemu: true
        - os: 'ubuntu-latest'
          cibw_build: "cp37-musllinux*"
          cibw_archs_linux: 'aarch64'
          name: '(musllinux aarch64)'
          qemu: true
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # unshallow fetch for setuptools-scm

    - name: Set up QEMU
      if: matrix.qemu
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all

    - name: Build wheels
      uses: pypa/cibuildwheel@v2.16.5
      env:
        CIBW_BUILD: ${{ matrix.cibw_build }}
        CIBW_ARCHS: "auto64"
        CIBW_ARCHS_MACOS: ${{ matrix.cibw_archs_macos }}
        CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs_linux }}
        CIBW_ENVIRONMENT: "FREETYPEPY_BUNDLE_FT=yes PYTHON_ARCH=64"
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux2010
        CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
        CIBW_TEST_COMMAND: "pytest {project}/tests"
        CIBW_TEST_REQUIRES: "pytest"
      with:
        output-dir: dist

    - name: Upload distributions
      uses: actions/upload-artifact@v6
      with:
        path: dist
        name: dist-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.build }}-${{ matrix.name }}
        if-no-files-found: error
        compression-level: 0  # files already compressed

  sdist:
    name: Build source distrubtion
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # unshallow fetch for setuptools-scm
    - name: Set up Python 3.9
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
    - name: Build sdist
      run: python setup.py sdist
    - name: Upload sdist
      uses: actions/upload-artifact@v6
      with:
        path: dist
        name: dist-source
        if-no-files-found: error
        compression-level: 0  # files already compressed

  publish:
    name: Publish release to Pypi
    runs-on: ubuntu-latest
    needs: [build, sdist]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      id-token: write  # for attestation
    environment:
      name: pypi
      url: https://pypi.org/p/freetype-py/${{ github.ref }}/
    steps:
    - name: Download assets
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: dist
        pattern: dist-*
    - uses: pypa/gh-action-pypi-publish@release/v1

  test-pyinstaller:
    name: Test pyinstaller hook
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.9
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
    - name: Test pyinstaller hook
      env:
        FREETYPEPY_BUNDLE_FT: yes
        PYTHON_ARCH: 64
      run: |
        pip install pytest psutil pyinstaller>=4
        pip install .
        pytest -v --pyargs freetype.__pyinstaller.tests
